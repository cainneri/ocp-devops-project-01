apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-go-app
  namespace: app-dev
  labels:
    app: my-go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-go-app
  template:
    metadata:
      labels:
        app: my-go-app
    spec:
      containers:
        - name: my-go-app
          # This points exactly to the image our pipeline built in Milestone 2
          image: image-registry.openshift-image-registry.svc:5000/app-dev/my-go-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
